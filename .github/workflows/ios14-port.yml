      - name: Shim iOS 15 APIs in Melo-Controller
        run: |
          chmod -R u+w build/dd/SourcePackages/checkouts/Melo-Controller
          python3 - <<'PY'
          import re
          root = "build/dd/SourcePackages/checkouts/Melo-Controller/Sources/Melo-Controller/"

          def edit(rel, fn):
              p = root + rel
              s = open(p, encoding="utf-8").read()
              n = fn(s)
              assert n != s, "nothing changed in " + rel
              open(p, "w", encoding="utf-8").write(n)

          def on_lines(lines, pat, repl):
              def f(s):
                  L = s.split("\n")
                  for ln in lines:
                      n = re.sub(pat, repl, L[ln - 1])
                      assert n != L[ln - 1], "no match line %d: %s" % (ln, L[ln - 1])
                      L[ln - 1] = n
                  return "\n".join(L)
              return f

          # ButtonView: foregroundStyle -> foregroundColor, overlay(alignment:content:) -> overlayCompat
          edit("Buttons/ButtonView.swift", lambda s: s.replace(".foregroundStyle(", ".foregroundColor("))
          edit("Buttons/ButtonView.swift", on_lines([46, 66], r"\.overlay(\s*[({])", r".overlayCompat\1"))

          # Materials -> plain translucent color
          mat = lambda s: re.sub(r"\.background\(\s*\.ultraThinMaterial\s*\)",
                                 ".background(Color(white: 0.1).opacity(0.75))", s)
          edit("ControllerView.swift", mat)
          edit("Layout/LayoutEditorView.swift", mat)

          # LayoutOptionsView: alert with actions + Button roles
          edit("Layout/LayoutOptionsView.swift", on_lines([109], r"\.alert\(", ".alertCompat("))
          edit("Layout/LayoutOptionsView.swift", lambda s: re.sub(r",\s*role:\s*\.\w+", "", s))
          PY

          cat > build/dd/SourcePackages/checkouts/Melo-Controller/Sources/Melo-Controller/iOS14Compat.swift <<'SWIFT'
          import SwiftUI

          extension View {
              func overlayCompat<V: View>(alignment: Alignment = .center,
                                          @ViewBuilder content: () -> V) -> some View {
                  overlay(content(), alignment: alignment)
              }

              @ViewBuilder
              func alertCompat<S: StringProtocol, A: View, M: View>(
                  _ title: S,
                  isPresented: Binding<Bool>,
                  @ViewBuilder actions: () -> A,
                  @ViewBuilder message: () -> M
              ) -> some View {
                  if #available(iOS 15.0, *) {
                      self.alert(title, isPresented: isPresented, actions: actions, message: message)
                  } else {
                      self
                  }
              }
          }
          SWIFT
          echo "shims applied"

      - name: Fix iOS 15 APIs in app target
        run: |
          python3 - <<'PY'
          import re
          base = "MeloCafe/MeloCafe/"

          def edit(rel, fn):
              p = base + rel
              s = open(p, encoding="utf-8").read()
              n = fn(s)
              assert n != s, "nothing changed in " + rel
              open(p, "w", encoding="utf-8").write(n)

          # overlay(alignment:content:) -> compatOverlay
          edit("UI/Emulation/EmulationView.swift",
               lambda s: re.sub(r"\.overlay\(alignment:", ".compatOverlay(alignment:", s))

          # Section(String) { } -> Section(header:)
          edit("UI/GamesList/GameGraphicPacksView.swift",
               lambda s: s.replace("Section(group) {", "Section(header: Text(group)) {"))
          edit("UI/Settings/GraphicPacksView.swift",
               lambda s: s.replace("Section(group) {", "Section(header: Text(group)) {"))
          edit("UI/Settings/AppIconSwitcher.swift",
               lambda s: s.replace("Section(iconSet.creator) {", "Section(header: Text(iconSet.creator)) {")
                          .replace(".foregroundStyle(.tertiary)", ".foregroundColor(Color(UIColor.tertiaryLabel))"))

          # helper
          with open(base + "Common/Compat.swift", "a", encoding="utf-8") as f:
              f.write("""

          extension View {
              /// iOS 15 `overlay(alignment:content:)` replacement.
              func compatOverlay<V: View>(alignment: Alignment = .center,
                                          @ViewBuilder content: () -> V) -> some View {
                  overlay(content(), alignment: alignment)
              }
          }
          """.replace("\n          ", "\n"))
          print("app fixes applied")
          PY

      - name: Build MeloCafe (unsigned, device)
        run: |
          set +e
          xcodebuild -project MeloCafe/MeloCafe.xcodeproj -scheme MeloCafe \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1
          RC=$?
          echo "xcodebuild exit code: $RC"
          if [ $RC -ne 0 ]; then
            echo "================ ERRORS ================"
            grep -E "error:|fatal error:|ld: " build/xcodebuild.log | sort -u | cut -c1-400 | head -120
            echo "================ SwiftPM packages ================"
            for f in $(find build/dd/SourcePackages/checkouts -maxdepth 2 -name Package.swift 2>/dev/null); do
              echo "--- $f"; sed -n 1,30p "$f"
            done
            exit $RC
          fi

      - name: Package .ipa
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name MeloCafe.app | head -n1)
          test -n "$APP" || { echo "MeloCafe.app not found"; exit 1; }
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr MeloCafe-ios14-unsigned.ipa Payload
          ls -la MeloCafe-ios14-unsigned.ipa

      - name: Symbolicate launch crash (Cemu static init)
        continue-on-error: true
        run: |
          BIN=$(find build/dd/Build/Products -path "*Frameworks/Cemu.framework/Cemu" | head -n1)
          echo "binary: $BIN"
          echo "built UUID : $(dwarfdump --uuid "$BIN")"
          echo "crash UUID : FFAF6439-E7D1-3E4F-B5FD-FE820877000A (Cemu in the crash report)"
          {
            echo "== atos (load 0x104840000) =="
            xcrun atos -o "$BIN" -arch arm64 -l 0x104840000 0x10555bb3c 0x105622268
            echo "== nearest symbols =="
            python3 - "$BIN" <<'PY'
          import subprocess, sys, bisect
          out = subprocess.run(["nm", "-n", "-arch", "arm64", sys.argv[1]], capture_output=True, text=True).stdout
          syms = []
          for l in out.splitlines():
              p = l.split(None, 2)
              if len(p) == 3 and p[1] in "tTsS":
                  try: syms.append((int(p[0], 16), p[2]))
                  except ValueError: pass
          addrs = [a for a, _ in syms]
          for name, off in (("throw site", 0x10555bb3c - 0x104840000), ("init caller", 0x105622268 - 0x104840000)):
              for base in (0, 0x100000000):
                  i = bisect.bisect_right(addrs, off + base) - 1
                  if i >= 0:
                      print("%s +0x%x (base %#x): %s +%d" % (name, off, base, syms[i][1], off + base - syms[i][0]))
          PY
          } 2>&1 | tee build/crash-symbols.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MeloCafe-ios14
          path: |
            MeloCafe-ios14-unsigned.ipa
            build/xcodebuild.log
            build/crash-symbols.txt
