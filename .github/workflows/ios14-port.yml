name: MeloCafe iOS 14 port (apply + build)

# One file, nothing to copy around: drop it into .github/workflows/ of your MeloCafe repo.
# It applies the whole iOS 14 port on the CI checkout (patch is embedded below, base64),
# patches MoltenVK minos 15.0 -> 14.0, builds an unsigned .ipa and uploads it as an artifact.
# NOTE: the build steps are modeled on the project layout (CMake -> ../build/Cemu.xcodeproj, then
# MeloCafe.xcodeproj) and have NOT been run by me. If a step fails, send me the log.

on:
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/dependencies/vcpkg

jobs:
  build-ios14:
    runs-on: macos-15
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Apply iOS 14 port patch
