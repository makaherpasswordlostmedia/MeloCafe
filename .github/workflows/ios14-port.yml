      - name: Patch MoltenVK minos to 14.0
        run: |
          python3 - <<'PY'
          import struct
          base = "MeloCafe/MeloCafe/Depedencies/MoltenVK.xcframework/ios-arm64/MoltenVK.framework/"
          d = bytearray(open(base + "MoltenVK", "rb").read())
          assert struct.unpack("<I", d[:4])[0] == 0xFEEDFACF
          n = struct.unpack("<I", d[16:20])[0]; p = 32; hit = False
          for _ in range(n):
              cmd, sz = struct.unpack("<II", d[p:p+8])
              if cmd == 0x32:
                  struct.pack_into("<I", d, p + 12, 14 << 16); hit = True
              p += sz
          assert hit
          open(base + "MoltenVK", "wb").write(d)
          pl = open(base + "Info.plist", "rb").read()
          open(base + "Info.plist", "wb").write(pl.replace(b"T15.0", b"T14.0"))
          print("MoltenVK patched")
          PY

