      - name: Add startup diagnostics to Cemu (terminate/signal logger)
        run: |
          cat > src/StartupDiag.cpp <<'CPP'
          // Startup diagnostics: logs uncaught C++ exceptions (incl. from static initializers)
          // to <app>/Documents/MeloCafe-startup.log (visible in the Files app) and stderr.
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <ctime>
          #include <exception>
          #include <initializer_list>
          #include <typeinfo>
          #include <cxxabi.h>
          #include <dlfcn.h>
          #include <execinfo.h>
          #include <signal.h>

          namespace
          {
          	FILE* OpenLog()
          	{
          		const char* home = getenv("HOME");
          		char path[1024];
          		snprintf(path, sizeof(path), "%s/Documents/MeloCafe-startup.log", home ? home : "/tmp");
          		FILE* f = fopen(path, "a");
          		return f ? f : stderr;
          	}

          	void DumpBacktrace(FILE* f)
          	{
          		void* frames[48];
          		int n = backtrace(frames, 48);
          		for (int i = 0; i < n; i++)
          		{
          			Dl_info info{};
          			if (dladdr(frames[i], &info) && info.dli_fname)
          			{
          				const char* img = strrchr(info.dli_fname, '/');
          				img = img ? img + 1 : info.dli_fname;
          				unsigned long off = (unsigned long)((char*)frames[i] - (char*)info.dli_fbase);
          				int st = 0;
          				char* dem = info.dli_sname ? abi::__cxa_demangle(info.dli_sname, nullptr, nullptr, &st) : nullptr;
          				fprintf(f, "  #%02d %s+0x%lx %s\n", i, img, off, dem ? dem : (info.dli_sname ? info.dli_sname : ""));
          				free(dem);
          			}
          			else
          				fprintf(f, "  #%02d %p\n", i, frames[i]);
          		}
          	}

          	void Report(FILE* f, const char* title)
          	{
          		time_t t = time(nullptr);
          		fprintf(f, "\n=== %s @ %s", title, ctime(&t));
          		if (std::type_info* ti = abi::__cxa_current_exception_type())
          		{
          			int st = 0;
          			char* dem = abi::__cxa_demangle(ti->name(), nullptr, nullptr, &st);
          			fprintf(f, "exception type: %s\n", dem ? dem : ti->name());
          			free(dem);
          			try { throw; }
          			catch (const std::exception& e) { fprintf(f, "what(): %s\n", e.what()); }
          			catch (...) { fprintf(f, "what(): <not a std::exception>\n"); }
          		}
          		else
          			fprintf(f, "no active C++ exception\n");
          		DumpBacktrace(f);
          		fflush(f);
          	}

          	void OnTerminate()
          	{
          		FILE* f = OpenLog();
          		Report(f, "std::terminate");
          		if (f != stderr)
          		{
          			fclose(f);
          			Report(stderr, "std::terminate");
          		}
          		abort();
          	}

          	void OnSignal(int sig)
          	{
          		FILE* f = OpenLog();
          		char title[48];
          		snprintf(title, sizeof(title), "fatal signal %d", sig);
          		Report(f, title);
          		if (f != stderr)
          			fclose(f);
          		signal(sig, SIG_DFL);
          		raise(sig);
          	}

          	__attribute__((constructor(101))) void InstallStartupDiag()
          	{
          		std::set_terminate(OnTerminate);
          		for (int s : {SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGTRAP})
          			signal(s, OnSignal);
          		FILE* f = OpenLog();
          		time_t t = time(nullptr);
          		fprintf(f, "\n--- startup diag installed @ %s", ctime(&t));
          		if (f != stderr)
          			fclose(f);
          	}
          }
          CPP
          python3 - <<'PY'
          p = "src/CMakeLists.txt"
          s = open(p).read()
          a = "add_library(CemuBin SHARED\n        main.cpp"
          b = "add_executable(CemuBin\n\t\tmain.cpp"
          assert a in s or b in s
          # StartupDiag.cpp goes FIRST so its constructor runs before other static initializers
          s = s.replace(a, "add_library(CemuBin SHARED\n        StartupDiag.cpp\n        main.cpp")
          s = s.replace(b, "add_executable(CemuBin\n\t\tStartupDiag.cpp\n\t\tmain.cpp")
          open(p, "w").write(s)
          print("StartupDiag.cpp added to CemuBin")
          PY
          grep -n "StartupDiag" src/CMakeLists.txt

      - name: Fix Cemu launch crash (xbyak Cpu static init throws on iOS 14)
        run: |
          python3 - <<'PY'
          p = "src/Cafe/HW/Espresso/Recompiler/BackendAArch64/BackendAArch64.cpp"
          s = open(p, encoding="utf-8").read()
          old_decl = "static const util::Cpu s_cpu;\n"
          assert s.count(old_decl) == 1, "s_cpu declaration not found"
          new_decl = """// Xbyak's Cpu ctor throws on some iOS versions (sysctl lookup fails). Doing that in a
          // static initializer aborts the app before main(), so detect lazily and fail safe.
          static bool IsAtomicSupported()
          {
          \tstatic const bool supported = []() {
          \t\ttry { return util::Cpu().isAtomicSupported(); }
          \t\tcatch (...) { return false; }
          \t}();
          \treturn supported;
          }
          """
          s = s.replace(old_decl, new_decl.replace("\n          ", "\n"))
          assert s.count("s_cpu.isAtomicSupported()") == 1, "s_cpu usage not found"
          s = s.replace("s_cpu.isAtomicSupported()", "IsAtomicSupported()")
          assert "s_cpu" not in s
          open(p, "w", encoding="utf-8").write(s)
          print("BackendAArch64.cpp patched")
          PY
          grep -n "IsAtomicSupported" src/Cafe/HW/Espresso/Recompiler/BackendAArch64/BackendAArch64.cpp

